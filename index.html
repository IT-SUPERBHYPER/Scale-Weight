<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⚡SCALE CAL: CYBERPUNK⚡</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <meta name="theme-color" content="#00f0ff"/>
  <style>
    /* CYBERPUNK THEME - MOBILE FIRST */
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Rajdhani', 'Segoe UI', 'Arial', sans-serif;
      background: #0a0c0f;
      background-image: 
        linear-gradient(45deg, rgba(255, 0, 255, 0.05) 0%, transparent 20%),
        linear-gradient(135deg, rgba(0, 255, 255, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 50% 50%, #1a1f2e 0%, #0b0d14 100%);
      color: #e0e0ff;
      padding: 8px;
      min-height: 100vh;
      position: relative;
    }

    /* Glitch effect overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,255,255,0.02) 0px, rgba(255,0,255,0.02) 2px, transparent 3px, transparent 6px);
      pointer-events: none;
      z-index: 9999;
    }

    h1 {
      color: #00f0ff;
      font-size: 1.8em;
      margin: 10px 0 12px 0;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 
        0 0 5px #00f0ff,
        0 0 10px #00f0ff,
        2px 2px 0 #ff00ff,
        -2px -2px 0 #00ffff;
      font-weight: 700;
      word-break: break-word;
      animation: glitch 3s infinite;
    }

    @keyframes glitch {
      0%, 100% { transform: skew(0deg, 0deg); opacity: 1; }
      95% { transform: skew(0deg, 0deg); opacity: 1; }
      96% { transform: skew(5deg, 1deg); opacity: 0.8; text-shadow: 3px 0 0 #ff00ff, -3px 0 0 #00ffff; }
      97% { transform: skew(-5deg, -1deg); opacity: 0.9; text-shadow: -3px 0 0 #ff00ff, 3px 0 0 #00ffff; }
      98% { transform: skew(0deg, 0deg); opacity: 1; }
    }

    form, .table-container, .export-btns, .search-bar input {
      border: 2px solid #00f0ff;
      box-shadow: 
        0 0 15px #00f0ff,
        inset 0 0 10px rgba(0, 240, 255, 0.3),
        5px 5px 0 #ff00ff;
      background: #0f1119;
      backdrop-filter: blur(2px);
    }

    form {
      border-radius: 16px;
      padding: 20px 16px;
      margin-bottom: 20px;
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
      background: rgba(10, 15, 25, 0.95);
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      color: #ffb3ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9em;
      text-shadow: 0 0 5px #ff00ff;
    }

    select, input[type="number"], input[type="text"] {
      padding: 16px 14px;
      margin-bottom: 18px;
      border: 2px solid #4a3f7a;
      border-radius: 12px;
      font-size: 1.18em;
      width: 100%;
      box-sizing: border-box;
      background: #0b0e14;
      color: #00ffff;
      font-weight: 500;
      -webkit-appearance: none;
      appearance: none;
      transition: all 0.2s;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    select:focus, input:focus {
      border-color: #ff00ff;
      outline: none;
      box-shadow: 0 0 15px #ff00ff, inset 0 0 10px #000;
    }

    /* Custom dropdown arrow */
    select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 20px;
    }

    button[type="submit"], .export-btns button {
      background: #120b29;
      color: #00f0ff;
      border: 2px solid #ff00ff;
      border-radius: 40px;
      padding: 18px 0;
      font-size: 1.3em;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 
        0 0 20px #ff00ff,
        inset 0 0 10px #00f0ff;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    button[type="submit"]:active, .export-btns button:active {
      background: #1f1440;
      transform: scale(0.98);
      box-shadow: 0 0 30px #00f0ff, inset 0 0 20px #ff00ff;
    }

    .export-btns {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 16px;
      border-radius: 50px;
      background: rgba(10, 15, 25, 0.9);
    }

    .export-btns button {
      width: calc(50% - 12px);
      min-width: 130px;
      padding: 16px 0;
      margin-bottom: 0;
      font-size: 1.1em;
      background: #0a0f1a;
    }

    #saveStatus {
      margin-left: 8px;
      font-size: 14px;
      color: #ffb3ff;
      text-shadow: 0 0 5px #ff00ff;
      width: 100%;
      text-align: center;
    }

    .search-bar {
      margin-bottom: 16px;
      text-align: center;
    }

    .search-bar input {
      padding: 16px 20px;
      border: 2px solid #ff00ff;
      border-radius: 40px;
      width: 100%;
      max-width: 100%;
      font-size: 1.2em;
      background: #0b0e14;
      color: #00f0ff;
      box-shadow: 0 0 15px #ff00ff;
    }

    .search-bar input::placeholder {
      color: #5f5f9f;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      margin: 0 auto;
      border-radius: 20px;
      padding: 4px;
      background: rgba(10, 15, 25, 0.95);
    }

    table {
      width: 100%;
      min-width: 680px;
      border-collapse: collapse;
      font-size: 1em;
      background: transparent;
      border-radius: 16px;
      overflow: hidden;
    }

    th, td {
      padding: 16px 8px;
      border-bottom: 1px solid #3a2f6a;
      text-align: left;
      color: #c0c0ff;
    }

    th {
      background: #1a0f2f;
      color: #ffb3ff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9em;
      text-shadow: 0 0 5px #ff00ff;
      border-bottom: 3px solid #ff00ff;
    }

    td {
      background: rgba(20, 15, 35, 0.8);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .flag {
      color: #ff5f7f;
      font-weight: 700;
      text-shadow: 0 0 10px #ff0000;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; text-shadow: 0 0 5px #ff0000; }
      50% { opacity: 0.8; text-shadow: 0 0 15px #ff0000; }
    }

    .okay {
      color: #5fffaf;
      font-weight: 700;
      text-shadow: 0 0 10px #00ff80;
    }

    .del-btn {
      background: #2a0f1f;
      color: #ff5f7f;
      border: 2px solid #ff00a0;
      border-radius: 30px;
      padding: 12px 12px;
      cursor: pointer;
      font-size: 1em;
      width: 100%;
      max-width: 90px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 10px #ff00a0;
      transition: all 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .del-btn:active {
      background: #4f1f2f;
      transform: scale(0.95);
      box-shadow: 0 0 20px #ff5f7f;
    }

    /* Android friendly touch targets */
    button, .del-btn, select, input {
      touch-action: manipulation;
      min-height: 52px;
    }

    /* Better scrollbar for Android */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1f2e;
    }

    ::-webkit-scrollbar-thumb {
      background: #ff00ff;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:active {
      background: #00f0ff;
    }

    /* Cyberpunk grid lines */
    .table-container::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgba(255,0,255,0.1) 1px, transparent 1px),
                  linear-gradient(0deg, rgba(0,255,255,0.1) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
      z-index: 0;
    }

    /* Responsive fixes */
    @media (max-width: 600px) {
      body { padding: 6px; }
      h1 { font-size: 1.5em; letter-spacing: 2px; }
      .export-btns button { font-size: 1em; padding: 14px 0; }
      th, td { padding: 14px 4px; font-size: 0.9em; }
      .del-btn { max-width: 70px; padding: 10px 6px; font-size: 0.9em; }
    }

    @media (max-width: 380px) {
      table { min-width: 550px; }
      th, td { padding: 12px 3px; font-size: 0.85em; }
    }
  </style>
</head>
<body>
  <h1>⚡SCALE CAL: CYBERPUNK⚡</h1>
  
  <form id="scaleForm" autocomplete="off">
    <label>🔷 SCALE MODEL</label>
    <select id="scaleModel" required>
      <option value="">SELECT MODEL</option>
      <option>DS782</option>
      <option>SM110</option>
      <option>MICRO A12E 300KG</option>
      <option>MICRO A12E 30KG</option>
      <option>MICRO A12E 600KG</option>
      <option>PALLET SCALE</option>
      <option>COIN SCALE</option>
    </select>

    <label>📍 LOCATION</label>
    <select id="location" required>
      <option value="">SELECT LOCATION</option>
      <optgroup label="🔴 TILLS" id="tillsGroup"></optgroup>
      <optgroup label="🔵 DEPARTMENTS">
        <option>BUTCHERY</option>
        <option>SPICE</option>
        <option>CHEESE</option>
        <option>FRUIT AND VEG</option>
        <option>RECEIVING</option>
        <option>CASH OFFICE</option>
        <option>SILVERS</option>
      </optgroup>
    </select>

    <label>⚖️ MEASURED (kg)</label>
    <input type="number" id="weight" step="0.01" placeholder="0.00" required>

    <label>📝 NOTES (OPTIONAL)</label>
    <input type="text" id="notes" placeholder="ENTER NOTES...">

    <button type="submit">➕ ADD READING</button>
  </form>

  <div class="export-btns">
    <button onclick="downloadCSV()" type="button">📥 CSV</button>
    <button onclick="downloadPDF()" type="button">📥 PDF</button>
    <span id="saveStatus"></span>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 SEARCH RESULTS...">
  </div>

  <div class="table-container">
    <table id="resultsTable">
      <thead>
        <tr>
          <th>DATE</th>
          <th>MODEL</th>
          <th>LOCATION</th>
          <th>MEAS.</th>
          <th>DIFF</th>
          <th>STATUS</th>
          <th>NOTES</th>
          <th>DEL</th>
        </tr>
      </thead>
      <tbody>
        <!-- results here -->
      </tbody>
    </table>
  </div>

  <script>
    // ==== BIN ID AND SECRET KEY ====
    const BIN_ID = '686798f38a456b7966bb2a98';
    const SECRET_KEY = '$2a$10$bB1IBj9WSxtFv8ueIC2FVuD60I3VYAsTardsW0hv4AiIU.KY77exu';
    // ===============================

    window.onload = function() {
      let tillOptions = '';
      for (let i = 1; i <= 83; i++) {
        tillOptions += `<option>TILL ${i}</option>`;
      }
      document.getElementById('tillsGroup').innerHTML = tillOptions;
      loadResults();
    }

    const tolerance = 0.05;
    let results = [];
    let filteredResults = null;

    document.getElementById('scaleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const scaleModel = document.getElementById('scaleModel').value;
      const location = document.getElementById('location').value;
      const weight = parseFloat(document.getElementById('weight').value);
      const notes = document.getElementById('notes').value.trim();
      const diff = +(weight - 5).toFixed(2);
      const status = Math.abs(diff) <= tolerance ? "OK" : "NEEDS CALIBRATION";
      const date = new Date().toLocaleString();
      results.push({ date, scaleModel, location, weight, diff, status, notes });
      renderTable();
      saveResults();
      this.reset();
      document.getElementById('scaleModel').focus();
    });

    function renderTable(filtered = null) {
      const data = filtered || results;
      const tbody = document.querySelector('#resultsTable tbody');
      tbody.innerHTML = data.map((r, idx) => `
        <tr>
          <td>${r.date}</td>
          <td>${r.scaleModel}</td>
          <td>${r.location}</td>
          <td>${r.weight.toFixed(2)}</td>
          <td>${r.diff > 0 ? "+" : ""}${r.diff.toFixed(2)}</td>
          <td class="${r.status === 'OK' ? 'okay' : 'flag'}">${r.status === 'OK' ? '✓ OK' : '⚠️ CAL'}</td>
          <td>${r.notes || '-'}</td>
          <td>
            <button class="del-btn" onclick="deleteEntry(${idx}, ${!!filtered})">✕</button>
          </td>
        </tr>
      `).join('');
    }

    window.deleteEntry = function(idx, isFiltered) {
      let data = filteredResults || results;
      if (isFiltered) {
        const row = data[idx];
        const mainIdx = results.findIndex(
          r => r.date === row.date &&
               r.scaleModel === row.scaleModel &&
               r.location === row.location &&
               r.weight === row.weight &&
               r.diff === row.diff &&
               r.status === row.status &&
               r.notes === row.notes
        );
        if (mainIdx > -1) results.splice(mainIdx, 1);
        data.splice(idx, 1);
        renderTable(data);
      } else {
        results.splice(idx, 1);
        renderTable();
      }
      saveResults();
    };

    function downloadCSV() {
      if (!results.length) return alert('⚠️ NO DATA TO DOWNLOAD!');
      let csv = 'Date,Scale Model,Location,Measured (kg),Difference,Status,Notes\n';
      csv += results.map(r =>
        `"${r.date}","${r.scaleModel}","${r.location}",${r.weight.toFixed(2)},"${r.diff > 0 ? "+" : ""}${r.diff.toFixed(2)}",${r.status},"${r.notes.replace(/"/g,'""')}"`
      ).join('\n');
      const blob = new Blob([csv], {type: 'text/csv'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cyber_scale_data.csv';
      a.click();
    }

    function downloadPDF() {
      if (!results.length) return alert('⚠️ NO DATA TO DOWNLOAD!');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const col = ["Date", "Model", "Location", "kg", "Diff", "Status", "Notes"];
      const rows = results.map(r => [
        r.date.substring(0,10),
        r.scaleModel.substring(0,12),
        r.location.substring(0,12),
        r.weight.toFixed(2),
        (r.diff > 0 ? "+" : "") + r.diff.toFixed(2),
        r.status === "OK" ? "OK" : "CAL",
        r.notes.substring(0,15) || "-"
      ]);
      doc.setFontSize(16);
      doc.setTextColor(0, 240, 255);
      doc.text("CYBER SCALE REPORT", 10, 15);
      doc.setFontSize(8);
      doc.setTextColor(255, 180, 255);
      let startY = 25;
      const rowHeight = 6;
      col.forEach((c, i) => {
        doc.text(c, 10 + i*27, startY);
      });
      rows.forEach((row, rIdx) => {
        doc.setTextColor(200, 200, 255);
        row.forEach((cell, cIdx) => {
          doc.text(String(cell), 10 + cIdx*27, startY + rowHeight * (rIdx + 1));
        });
      });
      doc.save('cyber_scale_report.pdf');
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      const value = this.value.trim().toLowerCase();
      if (!value) {
        filteredResults = null;
        renderTable();
        return;
      }
      filteredResults = results.filter(r =>
        Object.values(r).some(val =>
          String(val).toLowerCase().includes(value)
        )
      );
      renderTable(filteredResults);
    });

    async function loadResults() {
      setStatus('🔃 LOADING...');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: {
            'X-Master-Key': SECRET_KEY
          }
        });
        if (!res.ok) throw new Error('Error loading data');
        const data = await res.json();
        if (data.record && Array.isArray(data.record)) {
          results = data.record;
        } else if (data.record && Array.isArray(data.record.results)) {
          results = data.record.results;
        } else {
          results = [];
        }
        renderTable();
        setStatus('✅ LOADED!');
      } catch (err) {
        setStatus('❌ FAILED');
      }
    }

    async function saveResults() {
      setStatus('💾 SAVING...');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': SECRET_KEY
          },
          body: JSON.stringify(results)
        });
        if (!res.ok) throw new Error('Failed to save');
        setStatus('✅ SAVED!');
      } catch (err) {
        setStatus('❌ SAVE FAIL');
      }
    }

    function setStatus(msg) {
      document.getElementById('saveStatus').textContent = msg;
      if(msg!=="") setTimeout(()=>{document.getElementById('saveStatus').textContent="";},2000);
    }

    renderTable();

    // PWA Install (Service Worker)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
      .then(() => { /* success */ })
      .catch(() => { /* fail silently */ });
    }
  </script>
</body>
</html>
